<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MartinMesh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-dark: #0b141a;
      --panel-dark: #111b21;
      --header-dark: #202c33;
      --search-dark: #202c33;
      --input-dark: #2a3942;
      --bubble-out: #005c4b;
      --bubble-in: #202c33;
      --teal-accent: #00a884;
      --teal-dim: rgba(0, 168, 132, 0.2);
      --text-white: #e9edef;
      --text-muted: #8696a0;
      --border-color: #222e35;
      --blue-tick: #53bdeb;
      --status-red: #e76f51;
      --status-yellow: #e9c46a;
    }
    body, html { width: 100%; height: 100%; background: var(--bg-dark); color: var(--text-white); overflow: hidden; }
    .app-root { display: flex; width: 100vw; height: 100vh; position: relative; }

    .icon { width: 20px; height: 20px; fill: currentColor; display: inline-block; vertical-align: middle; }
    .icon-sm { width: 16px; height: 16px; fill: currentColor; }

    /* SIDEBAR */
    .sidebar { width: 100%; max-width: 420px; background: var(--panel-dark); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; z-index: 20; shrink: 0; }
    @media (min-width: 768px) { .sidebar { width: 380px; } }

    .header-bar { height: 60px; background: var(--header-dark); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
    .user-profile-badge { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; text-transform: uppercase; color: #fff; background: #374248; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); }
    .status-dot { width: 9px; height: 9px; background: var(--teal-accent); border-radius: 50%; border: 2px solid var(--header-dark); position: absolute; bottom: 0; right: 0; }

    .actions-row { display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
    .btn-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: inherit; cursor: pointer; }
    .btn-icon:active { background: rgba(255,255,255,0.08); }

    .search-section { padding: 8px 12px; background: var(--panel-dark); border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
    .search-bar { background: var(--search-dark); border-radius: 8px; display: flex; align-items: center; padding: 6px 12px; gap: 8px; color: var(--text-muted); }
    .search-bar input { background: transparent; border: none; outline: none; color: var(--text-white); font-size: 13px; width: 100%; }

    .chips-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .chip { font-size: 12px; padding: 4px 12px; border-radius: 16px; background: var(--header-dark); color: var(--text-muted); border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
    .chip.active { background: var(--teal-dim); color: var(--teal-accent); border-color: rgba(0, 168, 132, 0.4); font-weight: 600; }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { display: flex; align-items: center; padding: 12px 16px; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .chat-item:active, .chat-item.active { background: var(--header-dark); }
    .chat-info { flex: 1; min-width: 0; }
    .chat-row-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
    .chat-title { font-size: 14px; font-weight: 500; color: var(--text-white); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-time { font-size: 11px; color: var(--text-muted); }
    .chat-row-btm { display: flex; justify-content: space-between; align-items: center; }
    .chat-preview { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge-unread { background: var(--teal-accent); color: #0b141a; font-size: 10px; font-weight: bold; border-radius: 10px; padding: 2px 6px; }

    /* CONVERSATION PANE */
    .conversation-panel { flex: 1; display: flex; flex-direction: column; height: 100%; background: var(--bg-dark); position: relative; }
    .messages-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; background-color: #0b141a; background-image: radial-gradient(#1c272e 1px, transparent 1px); background-size: 20px 20px; }

    .msg-wrapper { display: flex; width: 100%; margin-bottom: 2px; }
    .msg-wrapper.self { justify-content: flex-end; }
    .msg-wrapper.peer { justify-content: flex-start; }

    .bubble { max-width: 78%; padding: 6px 10px 5px 10px; border-radius: 8px; font-size: 13.5px; line-height: 19px; word-break: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.25); }
    .bubble.self { background: var(--bubble-out); border-top-right-radius: 0px; }
    .bubble.peer { background: var(--bubble-in); border-top-left-radius: 0px; }
    .bubble-sender { font-size: 11px; font-weight: 700; color: var(--teal-accent); margin-bottom: 2px; }
    .bubble-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 10px; color: var(--text-muted); margin-top: 2px; float: right; margin-left: 10px; }

    .input-bar { height: 60px; background: var(--header-dark); padding: 6px 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--border-color); }
    .msg-field { flex: 1; background: var(--input-dark); border: none; outline: none; border-radius: 8px; height: 42px; padding: 0 14px; font-size: 14px; color: var(--text-white); }
    .btn-circle { width: 42px; height: 42px; border-radius: 50%; background: var(--teal-accent); border: none; display: flex; align-items: center; justify-content: center; color: #0b141a; cursor: pointer; flex-shrink: 0; }

    /* MODALS */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-card { width: 100%; max-width: 360px; background: var(--header-dark); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .modal-card input, .modal-card select { width: 100%; background: var(--panel-dark); border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 6px; margin: 8px 0 16px 0; outline: none; font-size: 14px; }
    .save-btn { width: 100%; background: var(--teal-accent); color: #0b141a; font-weight: bold; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }

    .hidden { display: none !important; }
    @media (max-width: 767px) {
      .mobile-hide { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="app-root">
    
    <!-- SIDEBAR -->
    <aside id="sidebarPane" class="sidebar">
      <div class="header-bar">
        <div class="user-profile-badge" onclick="openProfile()">
          <div style="position:relative;">
            <div id="selfAvatar" class="avatar">U</div>
            <span class="status-dot"></span>
          </div>
          <div>
            <div style="font-size:14px; font-weight:bold; color:var(--text-white); display:flex; align-items:center; gap:6px;">
              MartinMesh
              <span id="connTag" style="font-size:9px; font-weight:bold; background:rgba(0,168,132,0.15); color:var(--status-yellow); padding:2px 6px; border-radius:4px; font-family:monospace;">STANDALONE</span>
            </div>
            <div id="selfName" style="font-size:11px; color:var(--text-muted);">Set Profile</div>
          </div>
        </div>

        <div class="actions-row">
          <button class="btn-icon" onclick="openIPModal()" title="Link IP">
            <!-- Wi-Fi SVG -->
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4zm0 4c3.34 0 6.39 1.25 8.7 3.32L12 19.97 3.3 11.32A12.82 12.82 0 0 1 12 8z"/></svg>
          </button>
          <button class="btn-icon" onclick="openNewChat()" title="New Chat">
            <!-- Add SVG -->
            <svg class="icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-3 9h-4v4h-2v-4H7V9h4V5h2v4h4v2z"/></svg>
          </button>
        </div>
      </div>

      <div class="search-section">
        <div class="search-bar">
          <svg class="icon-sm" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="searchInput" placeholder="Search chats..." oninput="renderChats()" />
        </div>
        <div class="chips-row">
          <button class="chip active" onclick="setFilter('all', this)">All</button>
          <button class="chip" onclick="setFilter('groups', this)">Groups</button>
          <button class="chip" onclick="setFilter('direct', this)">Direct</button>
        </div>
      </div>

      <div id="chatsContainer" class="chat-list"></div>
    </aside>

    <!-- CONVERSATION PANEL -->
    <main id="chatPane" class="conversation-panel mobile-hide">
      <div class="header-bar" style="border-left: 1px solid var(--border-color);">
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="btn-icon" style="margin-left:-8px;" onclick="goBackToSidebar()">
            <!-- Left Arrow SVG -->
            <svg class="icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          </button>
          <div id="activeAvatar" class="avatar" style="background:#264653;">G</div>
          <div>
            <div id="activeTitle" style="font-size:14px; font-weight:600; color:var(--text-white);">#Global-Mesh</div>
            <div id="activeSubtitle" style="font-size:11px; color:var(--teal-accent);">Direct Mesh Frequency</div>
          </div>
        </div>

        <div class="actions-row">
          <button class="btn-icon" onclick="triggerCall('Video')">
            <svg class="icon" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
          </button>
          <button class="btn-icon" onclick="triggerCall('Voice')">
            <svg class="icon" viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.35-5.43-3.9-6.63-6.82l1.97-1.51c.24-.24.32-.59.24-.92C9.12 6.66 8.93 5.47 8.93 4.24 8.93 3.56 8.37 3 7.69 3H4.27C3.59 3 3 3.56 3 4.24c0 9.39 7.61 17 17 17 .68 0 1.25-.57 1.25-1.25v-3.41c0-.68-.57-1.2-1.24-1.2z"/></svg>
          </button>
        </div>
      </div>

      <div id="messagesContainer" class="messages-area"></div>

      <footer class="input-bar">
        <input type="text" id="textInput" class="msg-field" placeholder="Type a message" autocomplete="off" oninput="handleTyping(this.value)" onkeydown="if(event.key==='Enter') sendCurrentMessage()" />
        
        <button id="actionBtn" class="btn-circle" onmousedown="startPTT()" onmouseup="stopPTT()" ontouchstart="startPTT()" ontouchend="stopPTT()">
          <svg id="actionIcon" class="icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
        </button>
      </footer>
    </main>

  </div>

  <!-- ON-SCREEN IP MODAL (Bypasses Native Android Dialog Blocks) -->
  <div id="ipModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 style="margin-bottom:6px; font-size:16px;">Link Laptop Relay</h3>
      <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Enter your Laptop's Local IP address:</p>
      <input type="text" id="targetIpInput" placeholder="e.g. 192.168.1.7" />
      <button class="save-btn" onclick="confirmIP()">Connect Node</button>
      <button style="width:100%; background:transparent; border:none; color:var(--text-muted); margin-top:10px; cursor:pointer;" onclick="closeIPModal()">Cancel</button>
    </div>
  </div>

  <div id="profileModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 style="margin-bottom:8px; font-size:16px;">Identity Name</h3>
      <input type="text" id="profileNameInput" placeholder="Enter username..." />
      <button class="save-btn" onclick="saveProfile()">Save Identity</button>
      <button style="width:100%; background:transparent; border:none; color:var(--text-muted); margin-top:10px; cursor:pointer;" onclick="document.getElementById('profileModal').classList.add('hidden')">Cancel</button>
    </div>
  </div>

  <div id="newChatModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 style="margin-bottom:8px; font-size:16px;">Create Chat</h3>
      <input type="text" id="newChatName" placeholder="Node or Channel Name..." />
      <select id="newChatType">
        <option value="direct">Direct Node (1-to-1)</option>
        <option value="group">Group Channel</option>
      </select>
      <button class="save-btn" onclick="saveNewChat()">Add Chat</button>
      <button style="width:100%; background:transparent; border:none; color:var(--text-muted); margin-top:10px; cursor:pointer;" onclick="document.getElementById('newChatModal').classList.add('hidden')">Cancel</button>
    </div>
  </div>

  <script>
    let myName = localStorage.getItem("mm_user_name") || "Node-" + Math.floor(100 + Math.random()*900);
    const myId = "NODE-" + Math.floor(1000 + Math.random()*9000);
    let activeChatId = "global-mesh";
    let activeFilter = "all";
    let meshSocket = null;

    let conversations = JSON.parse(localStorage.getItem("mm_chat_threads")) || [
      { id: "global-mesh", title: "#Global-Mesh", type: "group", lastMsg: "Zero-Internet Radio Active", time: "Now", unread: 0 },
      { id: "device-alpha", title: "Device Alpha", type: "direct", lastMsg: "Link standing by", time: "11:20", unread: 0 }
    ];

    let messages = JSON.parse(localStorage.getItem("mm_chat_msgs")) || {
      "global-mesh": [
        { sender: "System", text: "MartinMesh initialized. Direct offline channel open.", time: "12:00", isSelf: false, type: "text" }
      ]
    };

    function getInitials(title) {
      if(!title) return "N";
      return title.replace(/#/g, '').trim().substring(0,2).toUpperCase();
    }

    function init() {
      document.getElementById("selfName").innerText = myName;
      document.getElementById("selfAvatar").innerText = getInitials(myName);
      renderChats();
      selectChat(activeChatId);

      const isDesktop = window.navigator.userAgent.indexOf("Windows") !== -1 || window.location.protocol === "file:";
      if (isDesktop) {
        setTimeout(() => connectSocket("localhost"), 400);
      } else {
        const lastIp = localStorage.getItem("mm_last_ip") || "192.168.1.7";
        setTimeout(() => connectSocket(lastIp), 600);
      }
    }

    function renderChats() {
      const container = document.getElementById("chatsContainer");
      container.innerHTML = "";
      const search = document.getElementById("searchInput").value.toLowerCase();

      conversations.forEach(c => {
        if(activeFilter === 'groups' && c.type !== 'group') return;
        if(activeFilter === 'direct' && c.type !== 'direct') return;
        if(search && !c.title.toLowerCase().includes(search)) return;

        const isCurrent = c.id === activeChatId;
        const item = document.createElement("div");
        item.className = "chat-item" + (isCurrent ? " active" : "");
        item.onclick = () => selectChat(c.id);

        const avatarColor = c.type === 'group' ? '#264653' : '#2a9d8f';

        item.innerHTML = `
          <div class="avatar" style="background:${avatarColor}; font-size:12px;">${getInitials(c.title)}</div>
          <div class="chat-info">
            <div class="chat-row-top">
              <span class="chat-title">${c.title}</span>
              <span class="chat-time">${c.time || ''}</span>
            </div>
            <div class="chat-row-btm">
              <span class="chat-preview">${c.lastMsg || 'Tap to message'}</span>
              ${c.unread > 0 ? `<span class="badge-unread">${c.unread}</span>` : ''}
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function selectChat(id) {
      activeChatId = id;
      const target = conversations.find(c => c.id === id) || conversations[0];
      target.unread = 0;
      saveData();

      document.getElementById("activeTitle").innerText = target.title;
      document.getElementById("activeSubtitle").innerText = target.type === 'group' ? 'Tactical Group • Offline' : 'Direct Node • Ready';
      document.getElementById("activeAvatar").innerText = getInitials(target.title);

      document.getElementById("sidebarPane").classList.add("mobile-hide");
      document.getElementById("chatPane").classList.remove("mobile-hide");

      renderChats();
      renderMessages();
    }

    function goBackToSidebar() {
      document.getElementById("sidebarPane").classList.remove("mobile-hide");
      document.getElementById("chatPane").classList.add("mobile-hide");
    }

    function renderMessages() {
      const box = document.getElementById("messagesContainer");
      box.innerHTML = "";
      const list = messages[activeChatId] || [];

      list.forEach(m => {
        const wrap = document.createElement("div");
        wrap.className = "msg-wrapper " + (m.isSelf ? "self" : "peer");

        let body = `<span>${m.text}</span>`;
        if (m.type === 'voice') {
          body = `<div style="display:flex; align-items:center; gap:8px;">
            <button onclick="new Audio('${m.text}').play()" style="border:none; background:var(--teal-accent); color:#111; width:28px; height:28px; border-radius:50%; cursor:pointer;">▶</button>
            <span style="font-size:12px; font-family:monospace;">Voice Note</span>
          </div>`;
        }

        wrap.innerHTML = `
          <div class="bubble ${m.isSelf ? 'self' : 'peer'}">
            ${!m.isSelf ? `<div class="bubble-sender">${m.sender}</div>` : ''}
            ${body}
            <div class="bubble-meta">
              <span>${m.time}</span>
              ${m.isSelf ? `
                <svg style="width:14px; height:14px; fill:var(--blue-tick);" viewBox="0 0 24 24">
                  <path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"/>
                </svg>
              ` : ''}
            </div>
          </div>
        `;
        box.appendChild(wrap);
      });
      box.scrollTop = box.scrollHeight;
    }

    function sendCurrentMessage() {
      const input = document.getElementById("textInput");
      const text = input.value.trim();
      if (!text) return;

      dispatch(text, 'text');
      input.value = "";
      handleTyping("");
    }

    function dispatch(content, type = 'text') {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const msg = { sender: myName, text: content, time: timeStr, isSelf: true, type: type };
      if (!messages[activeChatId]) messages[activeChatId] = [];
      messages[activeChatId].push(msg);

      const target = conversations.find(c => c.id === activeChatId);
      if(target) {
        target.lastMsg = type === 'voice' ? '🎙️ Voice note' : content;
        target.time = timeStr;
      }

      saveData();
      renderMessages();
      renderChats();

      if (meshSocket && meshSocket.readyState === WebSocket.OPEN) {
        meshSocket.send(JSON.stringify({
          chatId: activeChatId,
          srcNodeId: myId,
          sender: myName,
          payload: content,
          type: type
        }));
      }
    }

    function connectSocket(ip) {
      if(meshSocket) {
        try { meshSocket.close(); } catch(e){}
      }
      const tag = document.getElementById("connTag");
      tag.innerText = "LINKING...";
      tag.style.color = "var(--status-yellow)";

      try {
        meshSocket = new WebSocket(`ws://${ip}:8080`);
        meshSocket.onopen = () => {
          tag.innerText = "LINKED";
          tag.style.color = "var(--teal-accent)";
          localStorage.setItem("mm_last_ip", ip);
        };
        meshSocket.onmessage = (e) => {
          try {
            const pkt = JSON.parse(e.data);
            if(pkt.srcNodeId === myId) return;

            const tChat = pkt.chatId || "global-mesh";
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (!messages[tChat]) messages[tChat] = [];
            messages[tChat].push({ sender: pkt.sender, text: pkt.payload, time: timeStr, isSelf: false, type: pkt.type });

            const c = conversations.find(x => x.id === tChat);
            if(c) {
              c.lastMsg = pkt.type === 'voice' ? '🎙️ Voice note' : pkt.payload;
              c.time = timeStr;
              if (activeChatId !== tChat) c.unread = (c.unread || 0) + 1;
            }

            saveData();
            if(activeChatId === tChat) renderMessages();
            renderChats();
          } catch(err){}
        };
        meshSocket.onclose = () => {
          tag.innerText = "OFFLINE";
          tag.style.color = "var(--status-red)";
        };
      } catch(e) {
        tag.innerText = "STANDALONE";
        tag.style.color = "var(--status-yellow)";
      }
    }

    function openIPModal() {
      const def = localStorage.getItem("mm_last_ip") || "192.168.1.7";
      document.getElementById("targetIpInput").value = def;
      document.getElementById("ipModal").classList.remove("hidden");
    }

    function closeIPModal() {
      document.getElementById("ipModal").classList.add("hidden");
    }

    function confirmIP() {
      const ip = document.getElementById("targetIpInput").value.trim();
      if(ip) {
        connectSocket(ip);
      }
      closeIPModal();
    }

    let mediaRecorder = null;
    let chunks = [];

    async function startPTT() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(blob);
          reader.onloadend = () => dispatch(reader.result, 'voice');
        };
        mediaRecorder.start();
        document.getElementById("actionBtn").style.background = "#e63946";
      } catch(e) {
        alert("Microphone permission required.");
      }
    }

    function stopPTT() {
      if(mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        document.getElementById("actionBtn").style.background = "var(--teal-accent)";
      }
    }

    function handleTyping(val) {
      const btn = document.getElementById("actionBtn");
      const icon = document.getElementById("actionIcon");
      if(val.trim().length > 0) {
        icon.innerHTML = `<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>`;
        btn.onclick = sendCurrentMessage;
        btn.onmousedown = null;
        btn.onmouseup = null;
      } else {
        icon.innerHTML = `<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>`;
        btn.onclick = null;
        btn.onmousedown = startPTT;
        btn.onmouseup = stopPTT;
      }
    }

    function openProfile() { document.getElementById("profileModal").classList.remove("hidden"); }
    function saveProfile() {
      const val = document.getElementById("profileNameInput").value.trim();
      if(val) {
        myName = val;
        localStorage.setItem("mm_user_name", myName);
        document.getElementById("selfName").innerText = myName;
        document.getElementById("selfAvatar").innerText = getInitials(myName);
      }
      document.getElementById("profileModal").classList.add("hidden");
    }

    function openNewChat() { document.getElementById("newChatModal").classList.remove("hidden"); }
    function saveNewChat() {
      const name = document.getElementById("newChatName").value.trim();
      const type = document.getElementById("newChatType").value;
      if(!name) return;

      const newId = "chat-" + Date.now();
      conversations.unshift({ id: newId, title: name, type: type, lastMsg: "Created channel", time: "Now", unread: 0 });
      messages[newId] = [];
      saveData();
      document.getElementById("newChatName").value = "";
      document.getElementById("newChatModal").classList.add("hidden");
      selectChat(newId);
    }

    function setFilter(f, btn) {
      activeFilter = f;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      renderChats();
    }

    function triggerCall(type) {
      alert(`[Offline P2P Radio] Signal sent via local frequency (${type}). Target node must be connected.`);
    }

    function saveData() {
      localStorage.setItem("mm_chat_threads", JSON.stringify(conversations));
      localStorage.setItem("mm_chat_msgs", JSON.stringify(messages));
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
