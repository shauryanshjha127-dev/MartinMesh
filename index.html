<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MartinMesh - Ultimate Offline Mesh & Tactical Comms</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .radar-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(1.05); } }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-100 flex flex-col h-screen select-none overflow-hidden">

  <!-- TOP HEADER -->
  <header class="bg-slate-900/95 border-b border-slate-800 p-3.5 flex items-center justify-between backdrop-blur z-20">
    <div class="flex items-center gap-3">
      <!-- Profile Picture / Avatar Trigger -->
      <div class="relative cursor-pointer" onclick="openProfileModal()">
        <img id="headerAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=MartinMesh" class="w-10 h-10 rounded-full border-2 border-emerald-500 object-cover bg-slate-800" />
        <span class="w-3 h-3 bg-emerald-500 rounded-full block absolute bottom-0 right-0 border-2 border-slate-900 radar-pulse"></span>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-sm font-black tracking-wider text-emerald-400">MARTIN<span class="text-white">MESH</span></h1>
          <span class="text-[9px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-1.5 py-0.5 rounded font-mono">OFFLINE</span>
        </div>
        <p class="text-[11px] text-slate-300 font-semibold cursor-pointer flex items-center gap-1" onclick="openProfileModal()">
          <span id="headerUserName">Set Call-Sign</span>
          <i class="fa-solid fa-pen text-[9px] text-slate-500"></i>
        </p>
      </div>
    </div>

    <!-- Actions (Call / Video / Settings) -->
    <div class="flex items-center gap-1.5">
      <button onclick="startDirectCall('voice')" title="Direct Voice Call (Wi-Fi P2P)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 flex items-center justify-center border border-slate-700">
        <i class="fa-solid fa-phone text-xs"></i>
      </button>
      <button onclick="startDirectCall('video')" title="Direct Video Call (Wi-Fi P2P)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 flex items-center justify-center border border-slate-700">
        <i class="fa-solid fa-video text-xs"></i>
      </button>
      <button onclick="openProfileModal()" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center border border-slate-700">
        <i class="fa-solid fa-gear text-xs"></i>
      </button>
    </div>
  </header>

  <!-- CHANNEL & GROUP SELECTOR -->
  <div class="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center gap-2 overflow-x-auto text-xs font-mono">
    <span class="text-[10px] text-slate-500 uppercase tracking-wider font-sans font-bold mr-1">GROUPS:</span>
    <button onclick="switchChannel('GLOBAL')" id="tab-GLOBAL" class="px-2.5 py-1 rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[11px] whitespace-nowrap">
      # 300m-Broadcast
    </button>
    <button onclick="switchChannel('ALPHA')" id="tab-ALPHA" class="px-2.5 py-1 rounded-md bg-slate-800 text-slate-400 border border-slate-700 text-[11px] whitespace-nowrap">
      # Team-Alpha
    </button>
    <button onclick="switchChannel('BRAVO')" id="tab-BRAVO" class="px-2.5 py-1 rounded-md bg-slate-800 text-slate-400 border border-slate-700 text-[11px] whitespace-nowrap">
      # Squad-Bravo
    </button>
  </div>

  <!-- RADAR / ENGINE METRICS HUD -->
  <div class="bg-slate-950/70 border-b border-slate-800 px-4 py-1.5 flex items-center justify-between text-[11px] font-mono text-slate-400">
    <div class="flex items-center gap-3">
      <span><i class="fa-solid fa-arrows-split-up-and-left text-amber-400 mr-1"></i>Hops: <b class="text-white" id="statHops">4 Max</b></span>
      <span><i class="fa-solid fa-tower-broadcast text-cyan-400 mr-1"></i>Radio: <b class="text-white">Dual P2P+BLE</b></span>
    </div>
    <span class="text-emerald-400"><i class="fa-solid fa-bolt mr-1"></i>Zero Server</span>
  </div>

  <!-- LIVE CALL MODAL (DIRECT P2P AUDIO / VIDEO) -->
  <div id="callOverlay" class="fixed inset-0 bg-slate-950/95 z-50 flex flex-col p-4 hidden">
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 bg-red-500 rounded-full animate-ping"></span>
        <h2 id="callTitle" class="text-sm font-bold uppercase text-white font-mono">Tactical P2P Call</h2>
      </div>
      <button onclick="endCall()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-bold">
        END CALL
      </button>
    </div>
    <div class="flex-1 flex flex-col items-center justify-center gap-4 relative mt-4">
      <video id="localVideo" autoplay muted playsinline class="w-full max-w-md h-64 bg-slate-900 rounded-2xl border border-slate-800 object-cover"></video>
      <div id="callStatusBadge" class="bg-slate-900/80 border border-slate-700 px-4 py-2 rounded-xl text-xs font-mono text-slate-300">
        Streaming over local direct Wi-Fi P2P radio...
      </div>
    </div>
  </div>

  <!-- CHAT MESSAGES LOG -->
  <main id="chatLog" class="flex-1 overflow-y-auto p-4 space-y-3">
    <div class="text-center my-3">
      <div class="inline-block bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 text-[11px] text-slate-400 font-mono">
        <i class="fa-solid fa-satellite-dish text-emerald-400 mr-1.5"></i>
        Direct jump relay active. Messages jump up to 4 devices (300m range).
      </div>
    </div>
  </main>

  <!-- BOTTOM INPUT BAR (TEXT + VOICE NOTE ENGINE) -->
  <footer class="p-3 bg-slate-900 border-t border-slate-800 z-10">
    <div class="flex items-center gap-2 max-w-2xl mx-auto">
      
      <!-- Push-to-Talk (PTT Voice Note) Button -->
      <button 
        id="pttBtn"
        onmousedown="startVoiceRecording()" 
        onmouseup="stopVoiceRecording()"
        ontouchstart="startVoiceRecording()" 
        ontouchend="stopVoiceRecording()"
        title="Hold to Record Voice Note"
        class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 flex items-center justify-center border border-slate-700 active:bg-amber-500 active:text-slate-950 transition"
      >
        <i class="fa-solid fa-microphone text-sm" id="pttIcon"></i>
      </button>

      <!-- Input Field -->
      <form id="sendForm" class="flex-1 flex items-center gap-2">
        <input 
          type="text" 
          id="msgInput" 
          placeholder="Message #300m-Broadcast..." 
          autocomplete="off"
          class="flex-1 bg-slate-800/90 text-white placeholder-slate-500 text-sm px-4 py-2.5 rounded-xl border border-slate-700/80 focus:outline-none focus:border-emerald-500 transition"
        />
        <button 
          type="submit" 
          class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl transition flex items-center justify-center active:scale-95"
        >
          <i class="fa-solid fa-paper-plane text-sm"></i>
        </button>
      </form>
    </div>
  </footer>

  <!-- PROFILE & AVATAR MODAL -->
  <div id="profileModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-sm font-bold text-white uppercase tracking-wider">Tactical Profile Settings</h2>
        <button onclick="closeProfileModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- Avatar Picker -->
      <div class="flex flex-col items-center gap-2">
        <img id="modalAvatarPreview" src="https://api.dicebear.com/7.x/bottts/svg?seed=MartinMesh" class="w-16 h-16 rounded-full border-2 border-emerald-500 object-cover bg-slate-800" />
        <label class="text-[11px] bg-slate-800 border border-slate-700 text-slate-300 px-3 py-1 rounded-lg cursor-pointer hover:bg-slate-700">
          <i class="fa-solid fa-camera mr-1 text-emerald-400"></i>Upload Photo
          <input type="file" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)" />
        </label>
      </div>

      <div>
        <label class="text-[11px] font-mono text-slate-400 uppercase">Your Display Name</label>
        <input 
          type="text" 
          id="nameInput" 
          placeholder="e.g. Shauryansh, Martin" 
          maxlength="18"
          class="w-full mt-1 bg-slate-800 text-white px-3.5 py-2.5 rounded-xl border border-slate-700 focus:outline-none focus:border-emerald-500 text-sm"
        />
      </div>

      <div class="pt-2">
        <button 
          onclick="saveUserProfile()" 
          class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition"
        >
          Save Identity
        </button>
      </div>
    </div>
  </div>

  <script>
    // Audio Chime Engine
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 600, duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Identity & Profile Logic
    let myUserName = localStorage.getItem("martinmesh_name") || "";
    let myAvatar = localStorage.getItem("martinmesh_avatar") || "https://api.dicebear.com/7.x/bottts/svg?seed=MartinMesh";
    let activeChannel = "GLOBAL";
    const myNodeId = "NODE-" + Math.floor(1000 + Math.random() * 9000);

    const headerUserName = document.getElementById("headerUserName");
    const headerAvatar = document.getElementById("headerAvatar");
    const modalAvatarPreview = document.getElementById("modalAvatarPreview");
    const nameInput = document.getElementById("nameInput");
    const profileModal = document.getElementById("profileModal");

    function updateProfileUI() {
      headerUserName.innerText = myUserName || "Set Call-Sign";
      headerAvatar.src = myAvatar;
      modalAvatarPreview.src = myAvatar;
      nameInput.value = myUserName;
    }

    function openProfileModal() {
      updateProfileUI();
      profileModal.classList.remove("hidden");
    }

    function closeProfileModal() {
      profileModal.classList.add("hidden");
    }

    function handleAvatarUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        myAvatar = e.target.result; // Base64 compressed image
        modalAvatarPreview.src = myAvatar;
      };
      reader.readAsDataURL(file);
    }

    function saveUserProfile() {
      const val = nameInput.value.trim();
      if (!val) return;
      myUserName = val;
      localStorage.setItem("martinmesh_name", myUserName);
      localStorage.setItem("martinmesh_avatar", myAvatar);
      updateProfileUI();
      closeProfileModal();
    }

    if (!myUserName) {
      setTimeout(openProfileModal, 300);
    } else {
      updateProfileUI();
    }

    // Channels / Groups Switching
    function switchChannel(channel) {
      activeChannel = channel;
      ['GLOBAL', 'ALPHA', 'BRAVO'].forEach(ch => {
        const btn = document.getElementById('tab-' + ch);
        if (ch === channel) {
          btn.className = "px-2.5 py-1 rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[11px] whitespace-nowrap";
        } else {
          btn.className = "px-2.5 py-1 rounded-md bg-slate-800 text-slate-400 border border-slate-700 text-[11px] whitespace-nowrap";
        }
      });
      document.getElementById("msgInput").placeholder = `Message #${channel}...`;
    }

    // Deduplication Memory & Log
    const seenPackets = new Set();
    const chatLog = document.getElementById("chatLog");

    function renderMessage(sender, text, isSelf = false, hops = 0, avatar = null, type = "text", audioBlobUrl = null, channel = "GLOBAL") {
      const wrapper = document.createElement("div");
      wrapper.className = `flex gap-2.5 ${isSelf ? 'flex-row-reverse' : 'flex-row'} items-start`;

      const avatarSrc = avatar || "https://api.dicebear.com/7.x/bottts/svg?seed=" + sender;
      const hopBadge = hops === 0 ? "Direct 0-150m" : `Jumped ${hops} Hop(s) (300m)`;

      let contentHtml = "";
      if (type === "voice" && audioBlobUrl) {
        contentHtml = `
          <div class="flex items-center gap-2 py-1">
            <button onclick="new Audio('${audioBlobUrl}').play()" class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-amber-400 hover:scale-105 transition">
              <i class="fa-solid fa-play text-xs"></i>
            </button>
            <span class="text-xs font-mono">Voice Note (Mesh Relay)</span>
          </div>
        `;
      } else {
        contentHtml = `<span>${text}</span>`;
      }

      wrapper.innerHTML = `
        <img src="${avatarSrc}" class="w-8 h-8 rounded-full border border-slate-700 object-cover mt-1" />
        <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'} max-w-[80%]">
          <div class="flex items-center gap-1.5 text-[10px] text-slate-400 font-mono mb-1">
            <span class="font-bold ${isSelf ? 'text-emerald-400' : 'text-cyan-300'}">${sender}</span>
            <span class="text-[9px] bg-slate-800 border border-slate-700 px-1 rounded">#${channel}</span>
            <span class="text-[9px] text-amber-400">${hopBadge}</span>
          </div>
          <div class="${isSelf ? 'bg-emerald-500 text-slate-950 font-medium' : 'bg-slate-800 text-slate-100 border border-slate-700'} px-3.5 py-2.5 rounded-2xl text-sm break-words shadow-md">
            ${contentHtml}
          </div>
        </div>
      `;

      chatLog.appendChild(wrapper);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    // Packet Protocol Engine (Jump / Multi-Hop Relaying)
    function createPacket(content, type = "text") {
      return {
        id: "pkt_" + Date.now() + "_" + Math.floor(Math.random() * 10000),
        srcNodeId: myNodeId,
        senderName: myUserName || "Anonymous",
        senderAvatar: myAvatar,
        channel: activeChannel,
        hops_remaining: 4, // 4 phones jump limit = 300+ meters
        hops_taken: 0,
        type: type,
        payload: content,
        timestamp: Date.now()
      };
    }

    // Inbound Packet Router
    window.processIncomingMeshPacket = function(packet) {
      if (seenPackets.has(packet.id)) return;
      seenPackets.add(packet.id);

      const isSelf = packet.srcNodeId === myNodeId;

      if (!isSelf) {
        playBeep(880, 0.1);
        if (packet.type === "voice") {
          renderMessage(packet.senderName, "", false, packet.hops_taken, packet.senderAvatar, "voice", packet.payload, packet.channel);
        } else {
          renderMessage(packet.senderName, packet.payload, false, packet.hops_taken, packet.senderAvatar, "text", null, packet.channel);
        }
      }

      // MULTI-HOP JUMP FORWARDING
      if (!isSelf && packet.hops_remaining > 0) {
        packet.hops_remaining -= 1;
        packet.hops_taken += 1;
        if (window.AndroidMeshBridge) {
          window.AndroidMeshBridge.broadcastRawPacket(JSON.stringify(packet));
        }
      }
    };

    // Send Text Form
    document.getElementById("sendForm").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!myUserName) { openProfileModal(); return; }

      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;

      playBeep(520, 0.05);
      const packet = createPacket(text, "text");
      seenPackets.add(packet.id);

      renderMessage(myUserName + " (You)", text, true, 0, myAvatar, "text", null, activeChannel);

      if (window.AndroidMeshBridge) {
        window.AndroidMeshBridge.broadcastRawPacket(JSON.stringify(packet));
      }
      input.value = "";
    });

    // Voice Note Engine (Push-To-Talk)
    let mediaRecorder = null;
    let audioChunks = [];
    const pttBtn = document.getElementById("pttBtn");

    async function startVoiceRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onloadend = () => {
            const base64Audio = reader.result;
            const packet = createPacket(base64Audio, "voice");
            seenPackets.add(packet.id);
            renderMessage(myUserName + " (You)", "", true, 0, myAvatar, "voice", base64Audio, activeChannel);
            if (window.AndroidMeshBridge) {
              window.AndroidMeshBridge.broadcastRawPacket(JSON.stringify(packet));
            }
          };
          reader.readAsDataURL(audioBlob);
        };
        mediaRecorder.start();
        pttBtn.classList.add("bg-red-500", "text-white");
      } catch (err) {
        console.warn("Audio mic permission required for offline voice note.");
      }
    }

    function stopVoiceRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        pttBtn.classList.remove("bg-red-500", "text-white");
      }
    }

    // Direct P2P Video / Audio Call Engine (Wi-Fi Direct)
    let localStream = null;
    const callOverlay = document.getElementById("callOverlay");
    const localVideo = document.getElementById("localVideo");

    async function startDirectCall(mode = 'video') {
      try {
        callOverlay.classList.remove("hidden");
        document.getElementById("callTitle").innerText = mode === 'video' ? "Wi-Fi Direct Video Stream" : "Wi-Fi Direct Audio Call";
        localStream = await navigator.mediaDevices.getUserMedia({
          video: mode === 'video',
          audio: true
        });
        localVideo.srcObject = localStream;
      } catch (e) {
        alert("Camera/Microphone permission required for direct P2P call.");
        endCall();
      }
    }

    function endCall() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      callOverlay.classList.add("hidden");
    }
  </script>
</body>
</html>
