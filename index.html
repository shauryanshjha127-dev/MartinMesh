<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MartinMesh - Offline WhatsApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #0b141a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .chat-bg {
      background-color: #0b141a;
      background-image: radial-gradient(#1f2c34 1px, transparent 1px);
      background-size: 20px 20px;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #374248; border-radius: 4px; }
    .bubble-out { background-color: #005c4b; border-radius: 8px 8px 0px 8px; }
    .bubble-in { background-color: #202c33; border-radius: 8px 8px 8px 0px; }
  </style>
</head>
<body class="text-slate-100 flex h-screen select-none overflow-hidden antialiased">

  <!-- LEFT SIDEBAR: CHAT LIST -->
  <aside id="sidebarPanel" class="w-full md:w-[380px] lg:w-[420px] bg-[#111b21] border-r border-[#222e35] flex flex-col h-full z-20 shrink-0">
    <!-- Header -->
    <div class="h-16 bg-[#202c33] px-4 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <div class="relative cursor-pointer" onclick="openProfileModal()">
          <img id="myAvatarImg" src="https://api.dicebear.com/7.x/bottts/svg?seed=MartinMesh" class="w-10 h-10 rounded-full bg-[#111b21] object-cover border border-[#00a884]" />
          <span class="w-2.5 h-2.5 bg-[#00a884] rounded-full absolute bottom-0 right-0 border-2 border-[#202c33]"></span>
        </div>
        <div>
          <h1 class="text-sm font-bold text-[#e9edef] flex items-center gap-1.5">
            MartinMesh
            <span id="connBadge" class="text-[9px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-1 py-0.2 rounded font-mono">STANDALONE</span>
          </h1>
          <p id="myCallSignLabel" class="text-[11px] text-[#8696a0] truncate max-w-[140px] cursor-pointer" onclick="openProfileModal()">User</p>
        </div>
      </div>
      
      <div class="flex items-center gap-1 text-[#aebac1]">
        <button onclick="promptConnectRelay()" title="Connect Node IP" class="w-9 h-9 rounded-full hover:bg-[#374248] flex items-center justify-center transition text-[#00a884]">
          <i class="fa-solid fa-wifi text-sm"></i>
        </button>
        <button onclick="openNewChatModal()" title="New Chat / Node" class="w-9 h-9 rounded-full hover:bg-[#374248] flex items-center justify-center transition">
          <i class="fa-solid fa-message text-sm"></i>
        </button>
        <button onclick="openProfileModal()" title="Settings" class="w-9 h-9 rounded-full hover:bg-[#374248] flex items-center justify-center transition">
          <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Search Bar & Filters -->
    <div class="p-2 border-b border-[#222e35] bg-[#111b21] space-y-2 shrink-0">
      <div class="bg-[#202c33] rounded-lg flex items-center px-3 py-1.5 gap-3">
        <i class="fa-solid fa-magnifying-glass text-[#8696a0] text-xs"></i>
        <input id="chatSearchInput" oninput="filterChatList()" type="text" placeholder="Search or start new chat" class="bg-transparent text-xs text-[#e9edef] placeholder-[#8696a0] focus:outline-none w-full" />
      </div>
      <div class="flex items-center gap-1.5 px-1 overflow-x-auto">
        <button onclick="setFilter('all')" class="filter-chip text-[11px] px-3 py-1 rounded-full bg-[#00a884]/20 text-[#00a884] font-medium border border-[#00a884]/40 whitespace-nowrap">All</button>
        <button onclick="setFilter('groups')" class="filter-chip text-[11px] px-3 py-1 rounded-full bg-[#202c33] text-[#8696a0] font-medium whitespace-nowrap">Groups</button>
        <button onclick="setFilter('direct')" class="filter-chip text-[11px] px-3 py-1 rounded-full bg-[#202c33] text-[#8696a0] font-medium whitespace-nowrap">Direct Nodes</button>
      </div>
    </div>

    <!-- Conversations List -->
    <div id="chatsContainer" class="flex-1 overflow-y-auto divide-y divide-[#222e35]/40"></div>
  </aside>

  <!-- RIGHT CHAT PANEL (MAIN CONVERSATION) -->
  <main id="conversationPanel" class="hidden md:flex flex-1 flex-col h-full bg-[#0b141a] relative z-10">
    <!-- Active Header -->
    <div class="h-16 bg-[#202c33] px-4 flex items-center justify-between border-l border-[#222e35] shrink-0">
      <div class="flex items-center gap-3">
        <button onclick="backToSidebar()" class="md:hidden text-[#aebac1] hover:text-white mr-1">
          <i class="fa-solid fa-arrow-left text-base"></i>
        </button>
        <div class="relative">
          <img id="activeChatAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Global" class="w-10 h-10 rounded-full bg-[#111b21] object-cover" />
          <span class="w-2.5 h-2.5 bg-[#00a884] rounded-full absolute bottom-0 right-0 border-2 border-[#202c33]"></span>
        </div>
        <div>
          <h2 id="activeChatTitle" class="text-sm font-semibold text-[#e9edef] leading-tight">#Global-Mesh</h2>
          <p id="activeChatSubtitle" class="text-[11px] text-[#8696a0]">Zero-Internet 300m Broadcast</p>
        </div>
      </div>

      <div class="flex items-center gap-2 text-[#aebac1]">
        <button onclick="initiateCall('video')" title="Direct Video Call" class="w-9 h-9 rounded-full hover:bg-[#374248] flex items-center justify-center transition">
          <i class="fa-solid fa-video text-sm"></i>
        </button>
        <button onclick="initiateCall('audio')" title="Direct Audio Call" class="w-9 h-9 rounded-full hover:bg-[#374248] flex items-center justify-center transition">
          <i class="fa-solid fa-phone text-sm"></i>
        </button>
        <button onclick="clearCurrentChat()" title="Clear Chat" class="w-9 h-9 rounded-full hover:bg-[#374248] flex items-center justify-center transition">
          <i class="fa-solid fa-trash-can text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Message Bubbles Container -->
    <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-2 chat-bg"></div>

    <!-- Bottom Input Toolbar -->
    <footer class="bg-[#202c33] px-3 py-2 flex items-center gap-2 shrink-0 border-t border-[#222e35]">
      <button onclick="sendQuickTacticalPing()" title="Tactical Ping" class="text-[#8696a0] hover:text-[#e9edef] p-2 transition">
        <i class="fa-solid fa-bolt text-lg"></i>
      </button>

      <form id="msgForm" class="flex-1 flex items-center gap-2" onsubmit="handleSendText(event)">
        <input 
          id="textInput" 
          type="text" 
          placeholder="Type a message" 
          autocomplete="off"
          oninput="toggleSendButton(this.value)"
          class="flex-1 bg-[#2a3942] text-[#e9edef] placeholder-[#8696a0] text-sm px-4 py-2.5 rounded-lg focus:outline-none focus:ring-1 focus:ring-[#00a884]"
        />

        <button 
          id="pttRecordBtn"
          type="button"
          onmousedown="startVoiceNote()"
          onmouseup="stopVoiceNote()"
          ontouchstart="startVoiceNote()"
          ontouchend="stopVoiceNote()"
          class="w-10 h-10 rounded-full bg-[#00a884] hover:bg-[#029070] text-[#111b21] flex items-center justify-center transition active:scale-95 shrink-0"
        >
          <i id="actionIcon" class="fa-solid fa-microphone text-base"></i>
        </button>
      </form>
    </footer>
  </main>

  <!-- MODAL: PROFILE & CALL-SIGN -->
  <div id="profileModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-[#202c33] border border-[#374248] rounded-xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-[#374248] pb-3">
        <h3 class="text-sm font-bold text-[#e9edef]">Profile Identity</h3>
        <button onclick="closeProfileModal()" class="text-[#8696a0] hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="flex flex-col items-center gap-3">
        <img id="modalAvatarPreview" src="https://api.dicebear.com/7.x/bottts/svg?seed=MartinMesh" class="w-20 h-20 rounded-full bg-[#111b21] border-2 border-[#00a884] p-1" />
        <button onclick="randomizeAvatar()" class="text-xs text-[#00a884] hover:underline">Generate New Avatar</button>
      </div>
      <div>
        <label class="text-[11px] text-[#8696a0] font-medium uppercase">Your Display Name</label>
        <input id="nameInputField" type="text" placeholder="Enter name" class="w-full mt-1 bg-[#111b21] text-white px-3 py-2 rounded-lg border border-[#374248] text-sm focus:outline-none focus:border-[#00a884]" />
      </div>
      <button onclick="saveUserProfile()" class="w-full bg-[#00a884] hover:bg-[#029070] text-[#111b21] font-bold py-2 rounded-lg text-sm transition">
        Save Changes
      </button>
    </div>
  </div>

  <!-- MODAL: CREATE NEW CHAT / PEER -->
  <div id="newChatModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-[#202c33] border border-[#374248] rounded-xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-[#374248] pb-3">
        <h3 class="text-sm font-bold text-[#e9edef]">Start New Conversation</h3>
        <button onclick="closeNewChatModal()" class="text-[#8696a0] hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div>
        <label class="text-[11px] text-[#8696a0] font-medium uppercase">Chat / Node Name</label>
        <input id="newChatTitle" type="text" placeholder="e.g. Device Bravo or Squad X" class="w-full mt-1 bg-[#111b21] text-white px-3 py-2 rounded-lg border border-[#374248] text-sm focus:outline-none focus:border-[#00a884]" />
      </div>
      <div>
        <label class="text-[11px] text-[#8696a0] font-medium uppercase">Type</label>
        <select id="newChatType" class="w-full mt-1 bg-[#111b21] text-white px-3 py-2 rounded-lg border border-[#374248] text-sm focus:outline-none">
          <option value="direct">1-to-1 Direct Peer</option>
          <option value="group">Group Channel</option>
        </select>
      </div>
      <button onclick="createNewConversation()" class="w-full bg-[#00a884] hover:bg-[#029070] text-[#111b21] font-bold py-2 rounded-lg text-sm transition">
        Create Chat
      </button>
    </div>
  </div>

  <script>
    const myNodeId = "NODE-" + Math.floor(1000 + Math.random() * 9000);
    let myUserName = localStorage.getItem("mm_username") || "User-" + Math.floor(100 + Math.random() * 900);
    let myAvatar = localStorage.getItem("mm_avatar") || ("https://api.dicebear.com/7.x/bottts/svg?seed=" + myUserName);
    let activeChatId = localStorage.getItem("mm_active_chat") || "global-mesh";
    let activeFilter = "all";
    let meshSocket = null;

    let conversations = JSON.parse(localStorage.getItem("mm_conversations")) || [
      { id: "global-mesh", title: "#Global-Mesh", type: "group", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Global", lastMsg: "Tap Wi-Fi to link devices", time: "Now", unread: 0 },
      { id: "device-alpha", title: "Device Alpha", type: "direct", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Alpha", lastMsg: "Ready for direct mesh comms", time: "10:15 AM", unread: 0 },
      { id: "device-bravo", title: "Device Bravo", type: "direct", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Bravo", lastMsg: "Offline link standing by", time: "Yesterday", unread: 0 },
      { id: "squad-bravo", title: "#Team-Bravo", type: "group", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Squad", lastMsg: "Frequency operational", time: "Sunday", unread: 0 }
    ];

    let messages = JSON.parse(localStorage.getItem("mm_messages")) || {
      "global-mesh": [
        { sender: "System", text: "Welcome to MartinMesh WhatsApp edition. Connect via Hotspot/Wi-Fi to broadcast.", time: "12:00", isSelf: false, type: "text" }
      ],
      "device-alpha": [],
      "device-bravo": [],
      "squad-bravo": []
    };

    function initApp() {
      document.getElementById("myCallSignLabel").innerText = myUserName;
      document.getElementById("nameInputField").value = myUserName;
      document.getElementById("myAvatarImg").src = myAvatar;
      document.getElementById("modalAvatarPreview").src = myAvatar;
      renderChatSidebar();
      selectChat(activeChatId);

      if (window.navigator.userAgent.indexOf("Windows") !== -1 || window.location.protocol === "file:") {
        setTimeout(() => connectRelay("localhost"), 800);
      }
    }

    function renderChatSidebar() {
      const container = document.getElementById("chatsContainer");
      container.innerHTML = "";
      const searchVal = document.getElementById("chatSearchInput").value.toLowerCase();

      conversations.forEach(c => {
        if (activeFilter === "groups" && c.type !== "group") return;
        if (activeFilter === "direct" && c.type !== "direct") return;
        if (searchVal && !c.title.toLowerCase().includes(searchVal)) return;

        const isCurrent = c.id === activeChatId;
        const item = document.createElement("div");
        item.className = `flex items-center px-3.5 py-3 gap-3 cursor-pointer transition select-none ${isCurrent ? 'bg-[#2a3942]' : 'hover:bg-[#202c33]'}`;
        item.onclick = () => selectChat(c.id);

        item.innerHTML = `
          <div class="relative shrink-0">
            <img src="${c.avatar}" class="w-12 h-12 rounded-full bg-[#111b21] object-cover" />
            ${c.type === 'direct' ? '<span class="w-2.5 h-2.5 bg-[#00a884] rounded-full absolute bottom-0 right-0 border-2 border-[#111b21]"></span>' : ''}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <h4 class="text-sm font-medium text-[#e9edef] truncate">${c.title}</h4>
              <span class="text-[10px] text-[#8696a0]">${c.time || ''}</span>
            </div>
            <div class="flex items-center justify-between">
              <p class="text-xs text-[#8696a0] truncate pr-2">${c.lastMsg || 'No messages'}</p>
              ${c.unread > 0 ? `<span class="bg-[#00a884] text-[#111b21] text-[10px] font-bold px-1.5 py-0.5 rounded-full shrink-0">${c.unread}</span>` : ''}
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function selectChat(id) {
      activeChatId = id;
      localStorage.setItem("mm_active_chat", id);
      const target = conversations.find(c => c.id === id) || conversations[0];
      target.unread = 0;
      saveConversations();

      document.getElementById("activeChatTitle").innerText = target.title;
      document.getElementById("activeChatSubtitle").innerText = target.type === 'group' ? 'Group Frequency • Offline' : 'Direct Peer Node • Ready';
      document.getElementById("activeChatAvatar").src = target.avatar;

      document.getElementById("sidebarPanel").classList.add("hidden", "md:flex");
      document.getElementById("conversationPanel").classList.remove("hidden");
      document.getElementById("conversationPanel").classList.add("flex");

      renderChatSidebar();
      renderMessages();
    }

    function backToSidebar() {
      document.getElementById("sidebarPanel").classList.remove("hidden");
      document.getElementById("conversationPanel").classList.add("hidden");
    }

    function renderMessages() {
      const box = document.getElementById("messagesContainer");
      box.innerHTML = "";
      const currentList = messages[activeChatId] || [];

      currentList.forEach(m => {
        const row = document.createElement("div");
        row.className = `flex ${m.isSelf ? 'justify-end' : 'justify-start'}`;

        let content = `<span class="leading-relaxed">${m.text}</span>`;
        if (m.type === "voice") {
          content = `
            <div class="flex items-center gap-2.5 py-1">
              <button onclick="new Audio('${m.text}').play()" class="w-8 h-8 rounded-full bg-[#00a884] text-[#111b21] flex items-center justify-center shrink-0">
                <i class="fa-solid fa-play text-xs"></i>
              </button>
              <div class="flex items-center gap-0.5 h-4">
                <span class="w-1 h-3 bg-[#8696a0] rounded"></span>
                <span class="w-1 h-4 bg-[#00a884] rounded"></span>
                <span class="w-1 h-2 bg-[#8696a0] rounded"></span>
                <span class="w-1 h-5 bg-[#00a884] rounded"></span>
                <span class="w-1 h-3 bg-[#8696a0] rounded"></span>
              </div>
              <span class="text-[10px] text-[#8696a0] font-mono">PTT Voice</span>
            </div>`;
        }

        row.innerHTML = `
          <div class="${m.isSelf ? 'bubble-out' : 'bubble-in'} px-3 py-1.5 max-w-[85%] md:max-w-[65%] text-xs text-[#e9edef] shadow relative">
            ${!m.isSelf ? `<div class="text-[10px] font-bold text-[#00a884] mb-0.5">${m.sender}</div>` : ''}
            <div>${content}</div>
            <div class="flex items-center justify-end gap-1 mt-1 text-[9px] text-[#8696a0]">
              <span>${m.time}</span>
              ${m.isSelf ? '<i class="fa-solid fa-check-double text-[#53bdeb] text-[10px]"></i>' : ''}
            </div>
          </div>
        `;
        box.appendChild(row);
      });
      box.scrollTop = box.scrollHeight;
    }

    function handleSendText(e) {
      e.preventDefault();
      const input = document.getElementById("textInput");
      const val = input.value.trim();
      if (!val) return;

      dispatchMeshPacket(val, "text");
      input.value = "";
      toggleSendButton("");
    }

    function dispatchMeshPacket(payload, type = "text") {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const msgObj = {
        sender: myUserName,
        text: payload,
        time: timeStr,
        isSelf: true,
        type: type
      };

      if (!messages[activeChatId]) messages[activeChatId] = [];
      messages[activeChatId].push(msgObj);
      saveMessages();

      const target = conversations.find(c => c.id === activeChatId);
      if (target) {
        target.lastMsg = type === 'voice' ? '🎙️ Voice note' : payload;
        target.time = timeStr;
        saveConversations();
      }

      renderMessages();
      renderChatSidebar();

      if (meshSocket && meshSocket.readyState === WebSocket.OPEN) {
        meshSocket.send(JSON.stringify({
          chatId: activeChatId,
          senderName: myUserName,
          srcNodeId: myNodeId,
          payload: payload,
          type: type,
          timestamp: Date.now()
        }));
      }
    }

    function handleIncomingPacket(data) {
      try {
        const pkt = JSON.parse(data);
        if (pkt.srcNodeId === myNodeId) return;

        const targetChatId = pkt.chatId || "global-mesh";
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const incomingMsg = {
          sender: pkt.senderName || "Peer",
          text: pkt.payload,
          time: timeStr,
          isSelf: false,
          type: pkt.type || "text"
        };

        if (!messages[targetChatId]) messages[targetChatId] = [];
        messages[targetChatId].push(incomingMsg);
        saveMessages();

        const conv = conversations.find(c => c.id === targetChatId);
        if (conv) {
          conv.lastMsg = pkt.type === 'voice' ? '🎙️ Voice note' : pkt.payload;
          conv.time = timeStr;
          if (activeChatId !== targetChatId) conv.unread = (conv.unread || 0) + 1;
          saveConversations();
        }

        if (activeChatId === targetChatId) {
          renderMessages();
        }
        renderChatSidebar();
      } catch (e) {
        console.error("Packet error", e);
      }
    }

    function connectRelay(ip) {
      if (meshSocket) meshSocket.close();
      const badge = document.getElementById("connBadge");
      badge.innerText = "LINKING...";
      badge.className = "text-[9px] bg-yellow-950 text-yellow-400 border border-yellow-800 px-1 rounded font-mono";

      try {
        meshSocket = new WebSocket(`ws://${ip}:8080`);
        meshSocket.onopen = () => {
          badge.innerText = "LINKED";
          badge.className = "text-[9px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-1 rounded font-mono";
          localStorage.setItem("last_ip", ip);
        };
        meshSocket.onmessage = (e) => handleIncomingPacket(e.data);
        meshSocket.onclose = () => {
          badge.innerText = "OFFLINE";
          badge.className = "text-[9px] bg-red-950 text-red-400 border border-red-800 px-1 rounded font-mono";
        };
      } catch (err) {
        badge.innerText = "STANDALONE";
      }
    }

    function promptConnectRelay() {
      const last = localStorage.getItem("last_ip") || "192.168.43.1";
      const ip = prompt("Enter Relay Node IP Address (e.g. laptop's Wi-Fi IP):", last);
      if (ip) connectRelay(ip);
    }

    let mediaRecorder = null;
    let audioChunks = [];

    async function startVoiceNote() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(blob);
          reader.onloadend = () => dispatchMeshPacket(reader.result, "voice");
        };
        mediaRecorder.start();
        document.getElementById("actionIcon").className = "fa-solid fa-circle-dot text-red-500 animate-pulse";
      } catch (e) {
        alert("Microphone permission required for voice notes.");
      }
    }

    function stopVoiceNote() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        document.getElementById("actionIcon").className = "fa-solid fa-microphone text-base";
      }
    }

    function toggleSendButton(val) {
      const icon = document.getElementById("actionIcon");
      const btn = document.getElementById("pttRecordBtn");
      if (val.trim().length > 0) {
        icon.className = "fa-solid fa-paper-plane text-sm";
        btn.onclick = () => document.getElementById("msgForm").requestSubmit();
        btn.onmousedown = null;
        btn.onmouseup = null;
      } else {
        icon.className = "fa-solid fa-microphone text-base";
        btn.onclick = null;
        btn.onmousedown = startVoiceNote;
        btn.onmouseup = stopVoiceNote;
      }
    }

    function sendQuickTacticalPing() {
      dispatchMeshPacket("⚡ Tactical Ping: Radio check confirmed.", "text");
    }

    function openProfileModal() { document.getElementById("profileModal").classList.remove("hidden"); }
    function closeProfileModal() { document.getElementById("profileModal").classList.add("hidden"); }
    function randomizeAvatar() {
      myAvatar = "https://api.dicebear.com/7.x/bottts/svg?seed=" + Math.random();
      document.getElementById("modalAvatarPreview").src = myAvatar;
    }
    function saveUserProfile() {
      const val = document.getElementById("nameInputField").value.trim();
      if (val) {
        myUserName = val;
        localStorage.setItem("mm_username", myUserName);
        localStorage.setItem("mm_avatar", myAvatar);
        document.getElementById("myCallSignLabel").innerText = myUserName;
        document.getElementById("myAvatarImg").src = myAvatar;
      }
      closeProfileModal();
    }

    function openNewChatModal() { document.getElementById("newChatModal").classList.remove("hidden"); }
    function closeNewChatModal() { document.getElementById("newChatModal").classList.add("hidden"); }
    function createNewConversation() {
      const title = document.getElementById("newChatTitle").value.trim();
      const type = document.getElementById("newChatType").value;
      if (!title) return;

      const newId = "chat-" + Date.now();
      const newConv = {
        id: newId,
        title: title,
        type: type,
        avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${title}`,
        lastMsg: "New thread started",
        time: "Now",
        unread: 0
      };
      conversations.unshift(newConv);
      messages[newId] = [];
      saveConversations();
      saveMessages();

      document.getElementById("newChatTitle").value = "";
      closeNewChatModal();
      selectChat(newId);
    }

    function clearCurrentChat() {
      if (confirm("Clear all messages in this conversation?")) {
        messages[activeChatId] = [];
        saveMessages();
        renderMessages();
      }
    }

    function initiateCall(type) {
      alert(`Starting direct ${type.toUpperCase()} call signal to active peer on offline radio frequency...`);
    }

    function setFilter(f) {
      activeFilter = f;
      document.querySelectorAll(".filter-chip").forEach(el => {
        el.className = "filter-chip text-[11px] px-3 py-1 rounded-full bg-[#202c33] text-[#8696a0] font-medium whitespace-nowrap";
      });
      event.target.className = "filter-chip text-[11px] px-3 py-1 rounded-full bg-[#00a884]/20 text-[#00a884] font-medium border border-[#00a884]/40 whitespace-nowrap";
      renderChatSidebar();
    }

    function filterChatList() { renderChatSidebar(); }
    function saveConversations() { localStorage.setItem("mm_conversations", JSON.stringify(conversations)); }
    function saveMessages() { localStorage.setItem("mm_messages", JSON.stringify(messages)); }

    window.onload = initApp;
  </script>
</body>
</html>
