name: Build MartinMesh Offline APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Create and Populate www Directory
        run: |
          mkdir -p www
          cp index.html www/

      - name: Initialize, Sync and Patch Cleartext Traffic
        run: |
          npx cap add android || true
          npx cap sync android
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload MartinMesh APK
        uses: actions/upload-artifact@v4
        with:
          name: MartinMesh-DualEngine-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
